{#
  本機預覽用的模板。整份 HTML 都不會被發布，只有 body 欄位會送去 WordPress。
  外框模擬 Elementor single-post 模板。
#}
<article class="preview-article preview-diary">
  <header class="preview-frame" aria-label="佈景主題外框（不會發布）">
    <p class="preview-frame-note">以下外框由網站佈景主題產生，發布台不會送出</p>
    <h1 class="preview-title">{{ title }}</h1>
    <p class="preview-meta">
      <span>{{ displayDate }}</span>
      {% if category %}<span class="preview-tag">{{ category }}</span>{% endif %}
    </p>
  </header>

  <div class="preview-body" aria-label="正文（會發布的內容）">
    {{ body | safe }}
  </div>
</article>
